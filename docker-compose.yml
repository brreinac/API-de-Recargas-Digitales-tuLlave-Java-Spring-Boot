services:
  postgres:
    image: postgres:17-alpine
    container_name: tullave-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tullave}
      POSTGRES_USER: ${POSTGRES_USER:-tullave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tullave}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tullave} -d ${POSTGRES_DB:-tullave}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tullave-api
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-tullave}
      DB_USERNAME: ${POSTGRES_USER:-tullave}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-tullave}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
